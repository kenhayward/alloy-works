# Development, and the small installations ADR-0019 describes. Every password here is a local
# default for containers bound to 127.0.0.1; none is a credential for anything deployed.
#
# Run it from anywhere with `docker compose -f deploy/compose.yaml ...`; deploy/README.md has the
# rest, including how to stop typing that. Every port it publishes is read from deploy/.env, which
# Compose loads from this directory; deploy/.env.example names them all with their defaults.
name: alloy-works

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  # The object store. `-s3.iam.readOnly=false` lets provisioning make a credential per tenant through
  # the IAM API; `weed mini` ignores that flag, which is why this is the full server. Only the S3
  # port is published: the filer's IAM service is unauthenticated inside the container.
  #
  # `store.localhost` is the name both sides use. A signed link carries the address that signed it,
  # so the browser must be able to follow the same one the service used - which is why the published
  # port is the same number as the one inside.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      ['server', '-dir=/data', '-s3', '-s3.port=${STORE_PORT:-8333}', '-s3.iam.readOnly=false']
    environment:
      AWS_ACCESS_KEY_ID: alloy-store-admin
      AWS_SECRET_ACCESS_KEY: alloy-store-admin-dev-secret
    ports:
      - '127.0.0.1:${STORE_PORT:-8333}:${STORE_PORT:-8333}'
    volumes:
      - seaweedfs-data:/data
    networks:
      default:
        aliases: [store.localhost]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${STORE_PORT:-8333}/healthz']
      interval: 2s
      timeout: 5s
      retries: 30

  # Development only: it stands in for an organisation's provider and for Google. It binds every
  # address inside its container and calls itself the name both sides reach it by.
  stand-in-idp:
    build:
      # The repo root, because the images are built from the whole workspace; this file and the
      # Dockerfile live here, one level down.
      context: ..
      dockerfile: deploy/Dockerfile
      target: tools
    command: ['pnpm', '--filter', '@alloy-works/stand-in-idp', 'start']
    environment:
      STAND_IN_HOST: 0.0.0.0
      STAND_IN_PORT: '${IDP_PORT:-9090}'
      STAND_IN_ISSUER: http://idp.localhost:${IDP_PORT:-9090}
      STAND_IN_REDIRECT_URIS: http://acme.localhost:${SERVICE_PORT:-8088}/v1/sign-in/organisation/callback,http://dev.acme.localhost:${SERVICE_PORT:-8088}/v1/sign-in/organisation/callback,http://127.0.0.1:${SERVICE_PORT:-8088}/v1/sign-in/organisation/callback
      STAND_IN_GOOGLE_REDIRECT_URI: http://signin.localhost:${SERVICE_PORT:-8088}/v1/sign-in/google/callback
    ports:
      - '127.0.0.1:${IDP_PORT:-9090}:${IDP_PORT:-9090}'
    networks:
      default:
        aliases: [idp.localhost]

  # Runs once: migrations, two invented environments, and a store credential for each. The service
  # and the worker wait for it to finish.
  setup:
    build:
      # The repo root, because the images are built from the whole workspace; this file and the
      # Dockerfile live here, one level down.
      context: ..
      dockerfile: deploy/Dockerfile
      target: tools
    command: ['pnpm', 'dev:setup']
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/postgres
      DEV_DATABASE_URL: postgres://postgres:postgres@postgres:5432/alloy_dev
      STAND_IN_ISSUER: http://idp.localhost:${IDP_PORT:-9090}
      OBJECT_STORE_ENDPOINT: http://store.localhost:${STORE_PORT:-8333}
      OBJECT_STORE_BUCKET: alloy-dev
      SECRET_OBJECT_STORE_KEY: ZGV2ZWxvcG1lbnQtb25seS1vYmplY3Qta2V5LTAwMDE=
      # An address anything can reach, whatever it makes of *.localhost: the end-to-end
      # suite drives the development environment by this one.
      DEV_EXTRA_HOSTNAME: 127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: 'no'

  service:
    build:
      # The repo root, because the images are built from the whole workspace; this file and the
      # Dockerfile live here, one level down.
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
    environment:
      DATABASE_URL: postgres://aw_service:aw_service_dev@postgres:5432/alloy_dev
      HOST: 0.0.0.0
      PORT: '${SERVICE_PORT:-8088}'
      LOG_LEVEL: info
      OBJECT_STORE_ENDPOINT: http://store.localhost:${STORE_PORT:-8333}
      OBJECT_STORE_BUCKET: alloy-dev
      SECRET_OBJECT_STORE_KEY: ZGV2ZWxvcG1lbnQtb25seS1vYmplY3Qta2V5LTAwMDE=
      SECRET_GOOGLE: stand-in-google-secret
      SECRET_SIGN_IN_STATE: development-only-state-key-not-a-secret
      GOOGLE_ISSUER: http://idp.localhost:${IDP_PORT:-9090}
      GOOGLE_CLIENT_ID: alloy-google-dev
      SIGN_IN_HOST: signin.localhost:${SERVICE_PORT:-8088}
      ALLOW_INSECURE_ISSUERS: 'true'
      # The connector, on the network only the two of them share, and the key the service presents
      # to it: the connector's CONNECTOR_KEY. A development-only value, as every key here is.
      CONNECTOR_URL: http://connector:8090
      SECRET_CONNECTOR_KEY: ZGV2ZWxvcG1lbnQtb25seS1jb25uZWN0b3Ita2V5LTE=
    ports:
      - '127.0.0.1:${SERVICE_PORT:-8088}:${SERVICE_PORT:-8088}'
    networks:
      - default
      - connector-private
    depends_on:
      setup:
        condition: service_completed_successfully
      stand-in-idp:
        condition: service_started

  worker:
    build:
      # The repo root, because the images are built from the whole workspace; this file and the
      # Dockerfile live here, one level down.
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://aw_worker:aw_worker_dev@postgres:5432/alloy_dev
      LOG_LEVEL: info
      OBJECT_STORE_ENDPOINT: http://store.localhost:${STORE_PORT:-8333}
      OBJECT_STORE_BUCKET: alloy-dev
      SECRET_OBJECT_STORE_KEY: ZGV2ZWxvcG1lbnQtb25seS1vYmplY3Qta2V5LTAwMDE=
    depends_on:
      setup:
        condition: service_completed_successfully

  # The one process that reaches a tenant's own source (data.md, "The connector"). It is on two
  # networks and no others: `connector-private`, which it shares with the service alone, and
  # `connector-egress`, out to the sources. Neither carries the platform or the host (the D1 plan,
  # D1-I), so it has no route to the database, the store, the provider or anything the host
  # publishes. It holds no platform credential: only the key the service presents and the key it
  # seals credentials with, both development-only values. CONNECTOR_DENY is `none` because the
  # networks already hold it apart; a deployment whose networks do not lists its ranges there.
  connector:
    build:
      # The repo root, because the images are built from the whole workspace; this file and the
      # Dockerfile live here, one level down.
      context: ..
      dockerfile: deploy/Dockerfile
      target: connector
    environment:
      CONNECTOR_KEY: ZGV2ZWxvcG1lbnQtb25seS1jb25uZWN0b3Ita2V5LTE=
      CONNECTOR_SEALING_KEY: ZGV2ZWxvcG1lbnQtb25seS1zZWFsaW5nLWtleS0wMDE=
      CONNECTOR_DENY: none
      LOG_LEVEL: info
    networks:
      - connector-private
      - connector-egress
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # Development and CI only, in the `sources` profile: a tenant's own PostgreSQL, seeded with a
  # sample, a read-only account `reader` and an account `writer` that may insert (D1-J). It is on
  # `connector-egress` alone and publishes no port, so only the connector reaches it. Pinned by digest,
  # as the connector's own suite pins it. Every password in the seed is an invented development value.
  source-postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    profiles: [sources]
    command:
      [
        'postgres',
        '-c',
        'ssl=on',
        '-c',
        'ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem',
        '-c',
        'ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key',
      ]
    environment:
      POSTGRES_PASSWORD: source-postgres-dev-password
      POSTGRES_DB: readings
    volumes:
      - ./sources/postgres.sql:/docker-entrypoint-initdb.d/postgres.sql:ro
    networks:
      - connector-egress
    healthcheck:
      # Over TCP: the image seeds on a server listening on its socket alone, then restarts it.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 5s
      retries: 45

# The connector's two networks (the D1 plan, D1-I): internal, so nothing on them is routed anywhere
# else, and with no address for the host on their bridge, so no process the host runs - and no port
# it publishes - answers there. Docker Engine 28 or later.
networks:
  connector-private:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  connector-egress:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  postgres-data:
  seaweedfs-data:
