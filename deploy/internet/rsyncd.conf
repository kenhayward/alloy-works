# /etc/rsyncd.conf: lets the backup machine pull a copy of the restic repository, and nothing else.
# Installed with NAS_ADDRESS replaced (deploy/internet/README.md). The repository is encrypted, so
# rsync's unencrypted transfer carries nothing readable; its password is checked by challenge.
uid = nas-pull
gid = nas-pull
use chroot = yes
max connections = 1
reverse lookup = no
log file = /var/log/rsyncd.log

[alloy-restic]
  path = /var/backups/alloy-restic
  comment = encrypted backups, read only
  read only = yes
  write only = no
  list = no
  hosts allow = NAS_ADDRESS
  hosts deny = *
  auth users = nas-pull
  secrets file = /etc/rsyncd.secrets
  strict modes = yes
