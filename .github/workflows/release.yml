name: Release

# The desktop app's release (the DR plan, DR-F; ADM-052): after CI passes on a push to main, a close
# - a version not yet released - becomes a release in the public releases repository, carrying the
# Windows installer, its blockmap and latest.yml, which the installed app's updater reads, and tag
# vX.Y.Z here. Public so the updater needs no token, however this repository is kept (ADR-0073). Any
# other green push finds its version already released and stops; a release that failed is tried
# again on the next.
# Run by hand, or on a pull request changing the release itself, it builds and uploads the installer
# to the run, publishing nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
  workflow_dispatch:

# Writes the tag here; reads the bridge contract from GitHub Packages. The releases repository is
# written with its own token, scoped to it alone, in the one step that publishes.
permissions:
  contents: write
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASES: kenhayward/aw-releases

# One at a time, and never cancelled: a release half-published is worse than one late.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Windows installer
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = 'workflow_run' ] &&
            git ls-remote --exit-code --tags "https://github.com/$RELEASES.git" "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is released already."
            echo 'go=false' >> "$GITHUB_OUTPUT"
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.go == 'true'
        # Pinned by commit: this workflow writes releases, so a moved tag must not run in it.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - if: steps.version.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.version.outputs.go == 'true'
        run: pnpm install --frozen-lockfile

      # Turborepo builds what the desktop app depends on first, the renderer among it.
      - name: Build
        if: steps.version.outputs.go == 'true'
        run: pnpm exec turbo run build --filter=@alloy-works/desktop...

      - name: Package
        if: steps.version.outputs.go == 'true'
        run: pnpm --filter @alloy-works/desktop exec electron-builder --config electron-builder.yml --publish never

      - name: Notes
        if: steps.version.outputs.go == 'true'
        run: pnpm --filter @alloy-works/desktop exec tsx scripts/release-notes.ts ../../CHANGELOG.md "$VERSION" > notes.md

      - name: Upload the build
        if: github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: AlloyWorks-Setup-${{ env.VERSION }}
          path: |
            release/AlloyWorks-Setup-${{ env.VERSION }}.exe
            release/AlloyWorks-Setup-${{ env.VERSION }}.exe.blockmap
            release/latest.yml
            notes.md

      # The commit released, tagged here; kept if a retry finds it already made.
      - name: Tag
        if: github.event_name == 'workflow_run' && steps.version.outputs.go == 'true'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi

      - name: Publish
        if: github.event_name == 'workflow_run' && steps.version.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >-
          gh release create "v$VERSION" -R "$RELEASES" --title "Alloy Works $VERSION" --notes-file notes.md
          "release/AlloyWorks-Setup-$VERSION.exe"
          "release/AlloyWorks-Setup-$VERSION.exe.blockmap"
          release/latest.yml

      # Copies of 0.220.0 read this repository's releases (their app-update.yml names it), so while it
      # is public it carries each release too, and they update to one that reads the releases
      # repository. Kept private, it stops.
      - name: Publish here too
        if: github.event.repository.private == false && github.event_name == 'workflow_run' && steps.version.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v$VERSION" --verify-tag --title "Alloy Works $VERSION" --notes-file notes.md
          "release/AlloyWorks-Setup-$VERSION.exe"
          "release/AlloyWorks-Setup-$VERSION.exe.blockmap"
          release/latest.yml
