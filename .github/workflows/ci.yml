name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first; no point burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    # The db suite runs against a real Postgres, as in development. PostgreSQL 16 or later is
    # required (role membership granted WITH INHERIT FALSE); the image matches compose.yaml.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ALLOY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile, never a loose install: a loose install would silently resolve a
      # different tree than the lock file names, which is the whole point of committing one.
      # This step is NOT continue-on-error - a lock file that will not install should stop the run.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The object store the objects and worker suites run against. A service container cannot take
      # a command, and SeaweedFS needs one, so it is started as a step.
      - name: Object store
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=alloy-store-admin \
            -e AWS_SECRET_ACCESS_KEY=alloy-store-admin-dev-secret \
            chrislusf/seaweedfs:4.46 server -dir=/data -s3 -s3.port=8333 -s3.iam.readOnly=false
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8333/healthz > /dev/null && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      # The pinned Typst, checked against its hash: the same version the tests, CI and the image use.
      - name: Typst
        run: pnpm --filter @alloy-works/worker fetch-typst

      # ---------------------------------------------------------------------------------------
      # TEMPORARY: every check below is continue-on-error while the repo is finding its baseline.
      # The run reports results without blocking a merge.
      #
      # These flags come off, and `main` gets branch protection requiring this job, once the
      # baseline is agreed. See docs/ci-and-releases.md ("Turning CI into a gate") for the
      # checklist. Until then a red check is information, not permission to ignore it.
      # ---------------------------------------------------------------------------------------
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Format
        run: pnpm format
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Build
        run: pnpm build
        continue-on-error: true

      - name: Test
        run: pnpm test
        continue-on-error: true
