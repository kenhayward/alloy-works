name: CI

# Two speeds (ADR-0039). A pull request runs the fast path: lint, format, typecheck, build and the
# tests of the packages it changes, or for one touching only docs, format and the docs' own checks.
# The full run - every suite, the whole system and the traceability gate - runs on a close (a PR
# changing version.json), on a PR changing CI or the deployment, after every merge to main, and
# nightly. A red full run on main opens an issue, and the next close cannot pass until it is fixed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A second push to the same branch supersedes the first; no point burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      docs: ${{ steps.decide.outputs.docs }}
      suites: ${{ steps.reach.outputs.suites }}
      rest: ${{ steps.reach.outputs.rest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - id: decide
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"; echo 'docs=false' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if echo "$files" | grep -qE '^(version\.json|\.github/|deploy/)'; then full=true; else full=false; fi
          if echo "$files" | grep -qvE '^(docs/|changes/|packages/trace/trace\.json$|[^/]+\.md$)'; then docs=false; else docs=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

      # The five longest suites run a job each, on the fast path as on the full run; every other
      # package's tests run in the build job. On the fast path, only what the change reaches: the
      # packages it changes and every package that depends on them (`turbo ls --affected`).
      - id: reach
        env:
          FULL: ${{ steps.decide.outputs.full }}
          DOCS: ${{ steps.decide.outputs.docs }}
        run: |
          node .github/scripts/reach.js >> "$GITHUB_OUTPUT"

  build:
    name: Lint, typecheck, build and test
    needs: changes
    runs-on: ubuntu-latest
    # The db suite runs against a real Postgres, as in development. PostgreSQL 16 or later is
    # required (role membership granted WITH INHERIT FALSE); the image matches deploy/compose.yaml.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ALLOY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Turbo holds each task's output until the task ends when it detects CI, so the slowest suite
      # looked like a hang. Streamed, every line arrives as it is printed, prefixed with its task.
      TURBO_LOG_ORDER: stream
      ALLOY_TEST_SOURCE_PORT: '5434'
      FULL: ${{ needs.changes.outputs.full }}
      DOCS: ${{ needs.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` compares with the base branch's history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile, never a loose install: a loose install would silently resolve a
      # different tree than the lock file names, which is the whole point of committing one.
      # This step is NOT continue-on-error - a lock file that will not install should stop the run.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The object store the objects and worker suites run against. A service container cannot take
      # a command, and SeaweedFS needs one, so it is started as a step.
      - name: Object store
        if: env.DOCS != 'true'
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=alloy-store-admin \
            -e AWS_SECRET_ACCESS_KEY=alloy-store-admin-dev-secret \
            chrislusf/seaweedfs:4.46 server -dir=/data -s3 -s3.port=8333 -s3.iam.readOnly=false
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8333/healthz > /dev/null && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      # Lint, format, typecheck and build block (docs/ci-and-releases.md). Test keeps continue-on-error:
      # the traceability gate already fails the run on a failed test report, after the reports upload.
      - name: Lint
        if: env.DOCS != 'true'
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        if: env.DOCS != 'true'
        run: pnpm typecheck

      - name: Build
        if: env.DOCS != 'true'
        run: pnpm build

      # Every package's tests but the five suites' (`rest`), or on the fast path those of them the
      # change reaches. A test that fails is tried once more (ADR-0039); one that then passes does not
      # block, and the Flakes step below reports it.
      - name: Test the changed packages
        if: env.FULL != 'true' && env.DOCS != 'true' && needs.changes.outputs.rest != ''
        run: pnpm exec turbo run test --continue ${{ needs.changes.outputs.rest }} -- --retry=1

      - name: The docs' own checks
        if: env.DOCS == 'true'
        run: pnpm exec turbo run test --continue --filter=@alloy-works/trace --filter=@alloy-works/desktop -- --retry=1

      - name: Trace check
        if: env.FULL != 'true'
        run: pnpm trace check

      # Every suite but the five, which have jobs of their own.
      - name: Test
        if: env.FULL == 'true'
        run: pnpm exec turbo run test --continue ${{ needs.changes.outputs.rest }} -- --retry=1
        continue-on-error: true

      - name: Flakes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/flakes.sh

      # What every suite above wrote, for the traceability gate's own job, which reads it beside the
      # end-to-end and browser suites' reports from the whole-system job. `.trace-results` is a hidden
      # directory, which the action leaves out unless told otherwise.
      - name: Test reports
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: trace-results-build
          path: .trace-results
          include-hidden-files: true
          if-no-files-found: error

      # The images are built on every pull request so a broken Dockerfile is found by the change
      # that broke it. They are never pushed: a registry comes with hosting. Their layers come from the
      # Actions cache the whole-system job writes, by target.
      - uses: docker/setup-buildx-action@v3
        if: env.FULL == 'true'

      - name: Images
        if: env.FULL == 'true'
        uses: docker/bake-action@v6
        with:
          source: .
          files: deploy/compose.yaml
          targets: service,worker,connector
          load: true
          # Bake reads the compose file's `context: ..` from the working directory, not from deploy/.
          set: |
            *.context=.
            service.tags=alloy-works-service
            worker.tags=alloy-works-worker
            connector.tags=alloy-works-connector
            service.cache-from=type=gha,scope=service
            worker.cache-from=type=gha,scope=worker
            connector.cache-from=type=gha,scope=connector

      # Each image refuses to start without its configuration, which is what a working entry point
      # looks like: the alternative is a stack trace about a missing module.
      - name: Image entry points
        if: env.FULL == 'true'
        run: |
          set -e
          docker run --rm alloy-works-worker typst --version | grep '0.15.1'
          # veraPDF's jars from its pinned image, on Debian's Java runtime, run as the worker's user.
          docker run --rm alloy-works-worker /opt/verapdf/verapdf --version | grep 'veraPDF 1.30.2'
          docker run --rm alloy-works-service 2>&1 | grep 'The service cannot start' || \
            { echo 'the service image did not reach its configuration'; exit 1; }
          docker run --rm alloy-works-worker 2>&1 | grep 'The worker cannot start' || \
            { echo 'the worker image did not reach its configuration'; exit 1; }
          docker run --rm alloy-works-connector 2>&1 | grep 'CONNECTOR_KEY is required' || \
            { echo 'the connector image did not reach its configuration'; exit 1; }
          # And the per-request child it spawns is beside its entry point.
          docker run --rm --entrypoint test alloy-works-connector -f dist/child.js

  # The five longest suites, each beside the job above on a runner of its own, on either path: run on
  # one runner, a change to a package they all depend on took nine minutes (ADR-0039).
  suites:
    name: The ${{ matrix.suite }} suite
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TURBO_LOG_ORDER: stream
      ALLOY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ALLOY_TEST_SOURCE_PORT: '5434'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Object store
        if: ${{ matrix.suite == 'service' || matrix.suite == 'worker' }}
        run: |
          docker run -d --name seaweedfs -p 8333:8333             -e AWS_ACCESS_KEY_ID=alloy-store-admin             -e AWS_SECRET_ACCESS_KEY=alloy-store-admin-dev-secret             chrislusf/seaweedfs:4.46 server -dir=/data -s3 -s3.port=8333 -s3.iam.readOnly=false
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8333/healthz > /dev/null && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      # The connector's own source: the pinned PostgreSQL and the seed the compose file's
      # `source-postgres` uses, on 127.0.0.1:5434.
      - name: Connector source
        if: ${{ matrix.suite == 'connector' }}
        run: pnpm --filter @alloy-works/connector source

      # The worker's own tools: the pinned Typst, checked against its hash; veraPDF by digest, the
      # checker the regression corpus answers to (PUB-087); and the Word validator every .docx a
      # worker test makes answers to.
      - name: The worker's tools
        if: ${{ matrix.suite == 'worker' }}
        run: |
          pnpm --filter @alloy-works/worker fetch-typst
          pnpm --filter @alloy-works/worker fetch-verapdf
          pnpm --filter @alloy-works/worker fetch-ooxml-check

      - name: Test
        run: pnpm exec turbo run test --filter=@alloy-works/${{ matrix.suite }} -- --retry=1

      - name: Flakes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/flakes.sh

      - name: Test reports
        if: always() && needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: trace-results-${{ matrix.suite }}
          path: .trace-results
          include-hidden-files: true
          if-no-files-found: error

  # The whole system, as a person's browser would meet it. Its own job because the stack publishes
  # the same ports the job above gives to a Postgres service container and a SeaweedFS step, and
  # two things cannot hold one port.
  end-to-end:
    name: The whole system
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_LOG_ORDER: stream
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The pinned Chromium, cached by the file that pins it: a new pin is a new key, so a cached build
      # is only ever the one the pin names, and fetch-chromium checks its hash whenever it downloads.
      - name: Chromium cache
        uses: actions/cache@v5
        with:
          path: tests/browser/.tools
          key: chromium-${{ runner.os }}-${{ hashFiles('tests/browser/src/chromium-release.ts') }}

      - name: Chromium
        run: pnpm --filter @alloy-works/browser fetch-chromium

      # The runner's own engine, in the log: the connector's networks need Docker Engine 28.0.0 or later
      # (deploy/README.md), which the isolation test asserts, and an earlier one cannot make them.
      - name: The engine
        run: docker version

      # The stack's images, built with layers from the Actions cache, one scope a target, and tagged
      # with the names Compose gives them, so `up` below builds nothing.
      - uses: docker/setup-buildx-action@v3

      - name: The images
        uses: docker/bake-action@v6
        with:
          source: .
          files: deploy/compose.yaml
          targets: stand-in-idp,setup,service,worker,connector
          load: true
          # Bake reads the compose file's `context: ..` from the working directory, not from deploy/.
          set: |
            *.context=.
            stand-in-idp.tags=alloy-works-stand-in-idp
            setup.tags=alloy-works-setup
            service.tags=alloy-works-service
            worker.tags=alloy-works-worker
            connector.tags=alloy-works-connector
            stand-in-idp.cache-from=type=gha,scope=tools
            stand-in-idp.cache-to=type=gha,mode=max,scope=tools
            setup.cache-from=type=gha,scope=tools
            service.cache-from=type=gha,scope=service
            service.cache-to=type=gha,mode=max,scope=service
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker
            connector.cache-from=type=gha,scope=connector
            connector.cache-to=type=gha,mode=max,scope=connector

      # With the development source, which the connector's isolation and end-to-end tests reach.
      - name: The stack
        id: stack
        run: docker compose -f deploy/compose.yaml --profile sources up -d --wait

      # Through turbo, which builds what the suite imports before running it. Every target is set here,
      # to the stack this job just started: neither suite has a default, and each refuses to run with
      # any of its targets unset, so it can never reach a stack it was not pointed at (#363).
      - name: End to end
        env:
          ALLOY_E2E_SERVICE: http://127.0.0.1:8088
          ALLOY_E2E_IDP: http://127.0.0.1:9090
          ALLOY_E2E_IDP_ISSUER: http://idp.localhost:9090
          ALLOY_E2E_STORE_AT: 127.0.0.1
          # The project the stack above runs as, compose.yaml's own name: the connector's tests reach
          # into its containers by it.
          ALLOY_E2E_COMPOSE_PROJECT: alloy-works
        run: pnpm exec turbo run test:e2e --filter=@alloy-works/e2e -- --retry=1

      # The renderer in a real browser, against the same containers (the W13 plan's B-A): run whenever
      # the stack came up, so a failing end-to-end check does not hide what the browser would say.
      # NOT continue-on-error, and its report feeds the gate below, so a failing browser test fails it.
      - name: Browser
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        env:
          ALLOY_BROWSER_SERVICE: http://dev.acme.localhost:8088
          ALLOY_BROWSER_API: http://127.0.0.1:8088
          ALLOY_BROWSER_IDP: http://idp.localhost:9090
          ALLOY_BROWSER_DATABASE: postgres://aw_service:aw_service_dev@127.0.0.1:5432/alloy_dev
          ALLOY_BROWSER_STORE_AT: 127.0.0.1
        run: pnpm exec turbo run test:browser --filter=@alloy-works/browser -- --retry=1

      - name: Flakes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/flakes.sh

      - name: Stop the stack
        if: always()
        run: |
          docker compose -f deploy/compose.yaml --profile sources logs --no-color > compose-logs.txt 2>&1 || true
          docker compose -f deploy/compose.yaml --profile sources down -v

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: compose-logs
          path: compose-logs.txt

      # The end-to-end and browser suites' reports, for the gate. None at all means the stack never
      # came up, and the gate's download then fails rather than passing without them.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trace-results-system
          path: .trace-results
          include-hidden-files: true
          if-no-files-found: error

  # The traceability gate, in a job of its own so it reads every suite's report: the build job's, the
  # three suites' and the whole-system job's, the browser suite's among them (the W13 plan's B-G). It runs unless the run
  # was cancelled, so a failed suite is read and refused rather than skipped.
  #
  # NOT continue-on-error. The baseline declares what this release is answerable for, so the gate
  # passes on the day it lands - and a traceability gate that is allowed to fail is not a gate. It
  # fails outright on a failed or stale report. It says nothing about the build job's own checks,
  # and does not begin the switch-over in docs/ci-and-releases.md.
  gate:
    name: Traceability gate
    needs: [changes, build, suites, end-to-end]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Every job's reports: the build job's, each suite's and the whole system's.
      - name: The reports
        uses: actions/download-artifact@v5
        with:
          pattern: trace-results-*
          path: .trace-results
          merge-multiple: true

      # Both suites that drive the stack must have reported. `pnpm trace gate` exempts their reports
      # from "no report at all", since `pnpm test` never writes them, so without this a run whose
      # browser step never ran - the stack came up and the end-to-end step died with nothing written -
      # would pass the gate on the build job's reports alone.
      - name: Both system reports
        run: |
          for report in e2e browser; do
            if [ ! -f ".trace-results/$report.json" ]; then
              echo "::error::.trace-results/$report.json is missing: the whole-system job did not report its $report suite"
              exit 1
            fi
          done

      - name: Traceability gate
        run: pnpm trace gate

  # The one required check (ADR-0039): every job above passed or was not asked for. On main, a red
  # full run opens an issue, or comments on the one already open.
  checks:
    name: Checks
    needs: [changes, build, suites, end-to-end, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job's verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done

      - name: A red main opens an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'main is red in:title' \
            --json number,title | jq -r '.[] | select(.title == "main is red") | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "Still red: $run"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title 'main is red' \
              --body "The full run failed on main: $run. The next close cannot pass until it is fixed (ADR-0039)."
          fi
